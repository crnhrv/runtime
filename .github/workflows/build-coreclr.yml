name: Build CoreCLR (win-x64 Release)

on:
  workflow_dispatch:
  push:
    branches:
      - apc-cet-only-10.0.15

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build coreclr.dll
        shell: cmd
        run: build.cmd -subset clr.runtime -c Release -a x64 -ci

      - name: Upload coreclr.dll and pdb
        uses: actions/upload-artifact@v4
        with:
          name: coreclr-win-x64-Release-10.0.15-apc-cet-only
          if-no-files-found: error
          path: |
            artifacts/bin/coreclr/windows.x64.Release/coreclr.dll
            artifacts/bin/coreclr/windows.x64.Release/PDB/coreclr.pdb

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: artifacts/log/
